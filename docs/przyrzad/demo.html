<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piłki: przyrząd pokazowy Jaskini</title>
<style>
  :root { color-scheme: dark; --bg: #0f1418; --panel: #172027; --ink: #e6edf2; --ink2: #9fb0bd; --line: #2a3640; --hot: #ffb547; --ok: #64d28a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100% - 20px); }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--ink2); }
  label { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--ink2); }
  .hud { position: absolute; left: 10px; bottom: 10px; color: var(--ink2); font: 12px/1.3 ui-monospace, monospace; }
  .trace { position: absolute; right: 10px; top: 10px; width: min(300px, 46%); max-height: 45%; overflow: auto; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: none; }
  .trace.on { display: block; }
  .trace h2 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); }
  .trace p { margin: 3px 0; }
  .trace time { color: var(--hot); font-family: ui-monospace, monospace; margin-right: 6px; }
  .pause { position: absolute; inset: 0; display: none; place-items: center; color: var(--ink2); font-size: 15px; }
  .pause.on { display: grid; }
</style>
</head>
<body>
<canvas id="c" aria-label="Piłki odbijające się od podłogi"></canvas>
<div class="ui">
  <button id="add" type="button">Dodaj piłkę</button>
  <button id="shake" type="button">Potrząśnij</button>
  <label>sprężystość <input id="e" type="range" min="0.5" max="0.98" step="0.01" value="0.86"></label>
</div>
<div class="hud" id="hud"></div>
<section class="trace" id="trace" aria-live="polite"><h2>Ślad: uwagi z Jaskini</h2></section>
<div class="pause" id="pause">pauza: okno w Jaskini jest ukryte</div>
<script src="jaskinia-przyrzad.js"></script>
<script>
/* A small physics toy that speaks the instrument contract: it tells Jaskinia who it is, what is happening, a few numbers,
   and what happened; it keeps the owner's remarks in its own trace. Opened on its own, it simply runs. */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const R = 14, G = 900;              // ball radius (px) and gravity (px/s²); 100 px count as 1 m in the numbers below
let W = 0, H = 0, balls = [], restit = 0.86, bounces = [], paused = false, t0 = performance.now(), frames = [];
function size() { const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * d); cv.height = Math.round(H * d); g.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', size); size();
function addBall(x, y) {
  const b = { x: x ?? R + Math.random() * (W - 2 * R), y: y ?? R + Math.random() * H * 0.3, vx: (Math.random() - 0.5) * 420, vy: -Math.random() * 300, still: 0, said: false, hue: 30 + balls.length * 47 % 300 };
  balls.push(b);
  Jaskinia.event(`nowa piłka (${balls.length})`);
  sayState();
}
document.getElementById('add').onclick = () => addBall();
document.getElementById('shake').onclick = () => { for (const b of balls) { b.vy -= 500 + Math.random() * 300; b.vx += (Math.random() - 0.5) * 400; b.still = 0; b.said = false; } Jaskinia.event('potrząśnięcie'); };
document.getElementById('e').oninput = ev => { restit = +ev.target.value; sayState(); };
cv.addEventListener('pointerdown', ev => addBall(ev.offsetX, ev.offsetY));
const energy = () => balls.reduce((a, b) => a + 0.5 * (b.vx * b.vx + b.vy * b.vy) / 1e4 + G / 100 * (H - R - b.y) / 100, 0);
function sayState() { Jaskinia.state(`${balls.length} piłki, energia ${energy().toFixed(1)} J, sprężystość ${restit.toFixed(2)}`, { pilki: balls.length, energia: +energy().toFixed(2), sprezystosc: restit, czas_s: Math.round((performance.now() - t0) / 1000) }); }
Jaskinia.hello({ name: 'Piłki', version: 'pokaz 1', wants: ['remark'] });
for (let i = 0; i < 3; i++) addBall();
Jaskinia.onStateRequest(() => ({ text: `${balls.length} piłki, energia ${energy().toFixed(1)} J, sprężystość ${restit.toFixed(2)}`, data: { pilki: balls.length, energia: +energy().toFixed(2), sprezystosc: restit } }));
Jaskinia.onRemark(r => {
  const tr = document.getElementById('trace');
  tr.classList.add('on');
  const p = document.createElement('p'), tm = document.createElement('time');
  tm.textContent = (r.at || '').slice(11, 19); p.append(tm, document.createTextNode(r.text));
  tr.append(p);
  window.__remarks = (window.__remarks || []).concat(r);
});
Jaskinia.onVisible(v => { paused = !v; document.getElementById('pause').classList.toggle('on', paused); });

let last = performance.now(), sigT = 0, stT = 0;
function step(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  frames.push(now); while (frames.length && now - frames[0] > 1000) frames.shift();
  if (!paused) for (const b of balls) {
    b.vy += G * dt; b.vx *= 1 - 0.15 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < R) { b.x = R; b.vx = -b.vx * restit; } if (b.x > W - R) { b.x = W - R; b.vx = -b.vx * restit; }
    if (b.y > H - R) { b.y = H - R; if (b.vy > 60) bounces.push(now); b.vy = -b.vy * restit; b.vx *= 0.98; }
    const moving = Math.abs(b.vy) > 40 || Math.abs(b.vx) > 25 || b.y < H - R - 2;
    b.still = moving ? 0 : b.still + dt;
    if (b.still > 1 && !b.said) { b.said = true; Jaskinia.event('piłka się zatrzymała'); }
    if (moving) b.said = false;
  }
  while (bounces.length && now - bounces[0] > 1000) bounces.shift();
  g.clearRect(0, 0, W, H);
  g.strokeStyle = '#2a3640'; g.beginPath(); g.moveTo(0, H - 0.5); g.lineTo(W, H - 0.5); g.stroke();
  for (const b of balls) { g.fillStyle = `hsl(${b.hue} 80% 62%)`; g.beginPath(); g.arc(b.x, b.y, R, 0, Math.PI * 2); g.fill(); }
  document.getElementById('hud').textContent = `${balls.length} piłki · ${energy().toFixed(1)} J · ${bounces.length} odbić/s · ${frames.length} kl./s${Jaskinia.active ? ' · w Jaskini' : ''}`;
  if (now - sigT > 100) { sigT = now; Jaskinia.signals({ energia: +energy().toFixed(2), odbicia: bounces.length, pilki: balls.length, fps: frames.length }); }
  if (now - stT > 1000) { stT = now; sayState(); }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
window.__boot = Math.random().toString(36).slice(2); // lets a check tell a running lab from a restarted one
</script>
</body>
</html>
