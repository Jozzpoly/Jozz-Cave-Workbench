name: Jaskinia Multi 2P entry probe (research branch only)
on:
  push:
    branches:
      - experiment/multi-2p-jaskinia-entry-2026-10-20
permissions:
  contents: read
jobs:
  verify-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate play catalogue from verified-entry source
        run: python3 -I tools/build.py
      - name: Compile self-contained Jaskinia
        run: python3 tools/render.py --app jaskinia
      - name: Test real browser play-entry behavior
        run: ONLY=games node tools/jk63_test.mjs
