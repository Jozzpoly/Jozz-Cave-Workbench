name: GPT TEMP — Git authorship vs credential identity
on:
  push:
    branches:
      - experiment/gpt-temporary-connected-instruments-2026-10-16
    paths:
      - '.github/workflows/gpt-temp-attribution-smoke.yml'
permissions:
  contents: write
jobs:
  test-one-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: One-time safe attribution experiment (existing temporary branch only)
        env:
          EXPECTED_REF: refs/heads/experiment/gpt-temporary-connected-instruments-2026-10-16
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          p=experiments/gpt-temporary-connected-instruments-2026-10-16/GPT_AUTHORSHIP_SMOKE.md
          test ! -e "$p" || exit 0
          cat > "$p" <<'EOF'
          # Temporary Git author attribution smoke test

          This document was generated once by GitHub Actions on an isolated GPT experiment branch.
          ChatGPT / GPT-6 authored the workflow recipe, but the workflow itself executed it.
          The OAuth/install token belongs to GitHub Actions, not to a separately authenticated GPT actor.

          The Git author name is **self-declared**. It does not prove which model authored the code.
          A GitHub avatar/profile requires a real account association; do not confuse it with authorship.
          Neither this file nor the push indicates Owner review or approval.
          EOF
          git add "$p"
          GIT_AUTHOR_NAME="GPT-6 (self-declared)" \
          GIT_AUTHOR_EMAIL="gpt6-provenance@example.invalid" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          git commit -m "gpt6(provenance): test distinct Git author and Actions committer" \
            -m "Agent-Performed-By: ChatGPT GPT-6 (workflow authored)" \
            -m "Recorded-Via: github-actions[bot] installation token" \
            -m "Identity-Assurance: self-declared, not independently authenticated" \
            -m "Owner-Approval: not implied"
          git push origin "HEAD:${GITHUB_REF_NAME}"
