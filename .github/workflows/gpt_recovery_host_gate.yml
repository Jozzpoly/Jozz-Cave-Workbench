name: GPT recovery real-host e2e (isolated research)
on:
  push:
    branches:
      - research/gpt-recovery-api-e2e-20261020
    paths:
      - tools/gpt_recovery_host_gate.mjs
      - tools/gpt_same_origin_session_gate.mjs
      - tools/gpt_onehome_cross_tool_gate.mjs
      - tools/gpt_onehome_ui_action_probe.mjs
      - tools/gpt_onehome_cross_origin_gate.mjs
      - .github/workflows/gpt_recovery_host_gate.yml
permissions:
  contents: read
jobs:
  real-host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned Medium research donor (no changes)
        uses: actions/checkout@v4
        with:
          repository: Jozzpoly/Shared-Work-Medium-Lab
          ref: 419b9c9dbf49301ed9fb9bf65e39de33d35f17bb
          path: medium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check original host and independent state (keep both verdicts)
        run: |
          set +e
          node tools/gpt_same_origin_session_gate.mjs
          collision=$?
          node tools/gpt_recovery_host_gate.mjs
          lifecycle=$?
          echo "TEST_STATUS collision=$collision lifecycle=$lifecycle"
          test "$collision" -eq 0 && test "$lifecycle" -eq 0
      - name: Test two REAL independent Medium worlds with Jaskinia native instruments
        run: node tools/gpt_onehome_cross_tool_gate.mjs
      - name: Test actual authoring pointer input and contextual action in Jaskinia
        run: node tools/gpt_onehome_ui_action_probe.mjs
      - name: Test off-origin scoped action without host inspecting lab memory
        run: node tools/gpt_onehome_cross_origin_gate.mjs
      - name: Keep UI screenshots and exact host for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-host-recovery-e2e
          path: |
            dist/_gpt_recovery_real_host_desktop.png
            dist/_gpt_recovery_real_host_phone.png
            dist/_gpt_onehome_cross_tool.png
            dist/_gpt_onehome_ui_action.png
            dist/_gpt_onehome_offorigin_action.png
            dist/jaskinia-web.html
          if-no-files-found: ignore
          retention-days: 7
